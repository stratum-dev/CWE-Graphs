name: Build CWE graphs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwe-graphs-release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List catalogs
        id: versions
        run: echo "versions=$(python -I scripts/fetch_cwe.py --list)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.setup.outputs.versions) }}
    name: build (${{ matrix.version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify pygraphviz and sfdp
        run: |
          python - <<'PY'
          import pygraphviz as pgv
          g = pgv.AGraph()
          g.add_edge("a", "b")
          g.layout(prog="sfdp")
          g.draw("/tmp/sfdp-check.svg", format="svg")
          print("pygraphviz", pgv.__version__, "with sfdp OK")
          PY

      - name: Fetch CWE ${{ matrix.version }}
        run: python -I scripts/fetch_cwe.py --versions ${{ matrix.version }}

      - name: Build CWE ${{ matrix.version }}
        run: python -I scripts/build_all.py --only ${{ matrix.version }} --offline

      - name: Remove shared index before upload
        run: rm -f out/index.html

      - name: Upload version build
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.version }}
          path: out
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all version builds
        uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: out
          merge-multiple: true

      - name: Rebuild indexes
        run: python -I scripts/make_index.py out

      - name: Package release
        run: |
          mkdir -p dist/cwe-graphs
          cp -r out dist/cwe-graphs/out
          cp -r scripts dist/cwe-graphs/scripts
          cp README.md README.zh-CN.md requirements.txt dist/cwe-graphs/
          find dist/cwe-graphs -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/cwe-graphs -type f -name '*.pyc' -delete

          {
            echo "CWE graphs build"
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF_NAME}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "versions: $(ls out | grep '^v' | sed 's/^v//' | sort -V | tr '\n' ' ')"
          } > dist/cwe-graphs/BUILD.txt

          cd dist
          zip -9 -r ../cwe-graphs.zip cwe-graphs
          cd ..
          ls -lh cwe-graphs.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cwe-graphs-${{ github.run_number }}-${{ github.run_attempt }}
          name: CWE graphs build ${{ github.run_number }}
          body: |
            Automated build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Download `cwe-graphs.zip`, unzip it, then open `out/index.html`.

            Includes every fetched catalog (CWE 4.0–4.21 and 5.0): complete
            layered and force-directed DAGs, per-pillar subgraphs, and CSV/JSON data.
          files: cwe-graphs.zip
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
